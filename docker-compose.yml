services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./context:/data/context:ro
    networks:
      - bot-network

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-changeme123}
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=${WAHA_API_KEY:-changeme123}
    volumes:
      - waha-data:/app/data
    networks:
      - bot-network

  # Ollama runs on host (Windows/Linux) for GPU access
  # If you want Docker Ollama (CPU only), uncomment below:
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  n8n_data:
  waha-data:
  # ollama_data:
